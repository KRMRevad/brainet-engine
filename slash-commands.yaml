# BRAINET AIOS Slash Commands Registry
# This file registers all available agent slash commands for Claude Code

version: "1.0"
framework: "synkra-aios"
project: "brainet-mvp"

commands:
  - name: aios-master
    description: "AIOS Master Orchestrator - Central coordination of all agents"
    path: ".agent/workflows/aios-master.md"
    aliases: ["@aios-master"]
    role: "Master Orchestrator"
    category: "core"

  - name: dev
    description: "Developer Agent - Code implementation and debugging"
    path: ".agent/workflows/dev.md"
    aliases: ["@dev"]
    role: "Developer"
    category: "technical"

  - name: architect
    description: "Architect Agent - System design and architecture decisions"
    path: ".agent/workflows/architect.md"
    aliases: ["@architect"]
    role: "Architect"
    category: "technical"
    authority: "architecture-decisions"

  - name: qa
    description: "Quality Assurance Agent - Testing and quality verdicts"
    path: ".agent/workflows/qa.md"
    aliases: ["@qa"]
    role: "Quality Assurance"
    category: "quality"
    authority: "quality-verdicts"

  - name: pm
    description: "Project Manager Agent - Planning and coordination"
    path: ".agent/workflows/pm.md"
    aliases: ["@pm"]
    role: "Project Manager"
    category: "management"

  - name: po
    description: "Product Owner Agent - Vision and story creation"
    path: ".agent/workflows/po.md"
    aliases: ["@po"]
    role: "Product Owner"
    category: "management"
    authority: "story-creation"

  - name: sm
    description: "Scrum Master Agent - Process and sprint management"
    path: ".agent/workflows/sm.md"
    aliases: ["@sm"]
    role: "Scrum Master"
    category: "management"
    authority: "story-creation"

  - name: analyst
    description: "Business Analyst Agent - Requirements and analysis"
    path: ".agent/workflows/analyst.md"
    aliases: ["@analyst"]
    role: "Business Analyst"
    category: "analysis"

  - name: devops
    description: "DevOps Engineer Agent - Deployment and infrastructure"
    path: ".agent/workflows/devops.md"
    aliases: ["@devops"]
    role: "DevOps Engineer"
    category: "infrastructure"
    authority: ["git-push", "pull-requests", "releases"]

  - name: data-engineer
    description: "Data Engineer Agent - Data pipelines and databases"
    path: ".agent/workflows/data-engineer.md"
    aliases: ["@data-engineer"]
    role: "Data Engineer"
    category: "technical"

  - name: ux-design-expert
    description: "UX Design Expert Agent - User experience and design"
    path: ".agent/workflows/ux-design-expert.md"
    aliases: ["@ux-design-expert"]
    role: "UX Design Expert"
    category: "design"

  - name: squad-creator
    description: "Squad Creator Agent - Team organization and composition"
    path: ".agent/workflows/squad-creator.md"
    aliases: ["@squad-creator"]
    role: "Squad Creator"
    category: "organization"

# Authority Matrix (Non-Negotiable)
authorities:
  - name: "git-push"
    description: "Push code to remote repository"
    exclusive_agent: "devops"

  - name: "pull-requests"
    description: "Create Pull Requests"
    exclusive_agent: "devops"

  - name: "releases"
    description: "Create releases and tags"
    exclusive_agent: "devops"

  - name: "story-creation"
    description: "Create user stories"
    exclusive_agents: ["sm", "po"]

  - name: "architecture-decisions"
    description: "Make architecture decisions"
    exclusive_agent: "architect"

  - name: "quality-verdicts"
    description: "Issue quality verdicts"
    exclusive_agent: "qa"
